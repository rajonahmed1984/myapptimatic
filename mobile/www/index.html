<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>MyApptimatic</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }
        .card {
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .mark {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            border-radius: 18px;
            background: #0d9488;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        h1 { font-size: 19px; margin: 0 0 8px; }
        p { font-size: 14px; line-height: 1.6; color: #475569; margin: 0 0 24px; }
        button {
            appearance: none;
            border: 0;
            border-radius: 999px;
            background: #0d9488;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            padding: 12px 28px;
            cursor: pointer;
        }
        button:active { opacity: .85; }
        .status { margin-top: 16px; font-size: 12px; color: #94a3b8; min-height: 18px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="mark">MA</div>
        <h1>Connection unavailable</h1>
        <p>MyApptimatic could not reach the server. Check your internet connection and try again.</p>
        <button type="button" id="retry">Retry</button>
        <div class="status" id="status"></div>
    </div>

    <script>
        var statusEl = document.getElementById('status');

        function render() {
            statusEl.textContent = navigator.onLine ? 'Network detected. Tap retry.' : 'You are offline.';
        }

        document.getElementById('retry').addEventListener('click', function () {
            statusEl.textContent = 'Reconnecting…';
            window.location.reload();
        });

        window.addEventListener('online', render);
        window.addEventListener('offline', render);
        render();
    </script>
</body>
</html>
